# rca-lab configuration. Run `python -m rcalab init` to be prompted for the
# required (REQUIRED) fields; `python -m rcalab check` lists what is missing.
# You choose HOW telemetry is obtained with `source.mode` (works for any architecture):
#   tools = Jaeger (+ optional Prometheus/Loki)   ssh = docker host over SSH   both = traces + host metrics
# SSH is limited to a fixed allowlist of read-only commands (docker ps/stats/logs, cat <compose file>).

system:
  name: REQUIRED            # label for this target, e.g. sock-shop
  # Service names to analyse. Leave empty to auto-discover from traces.
  services: []

source:
  mode: tools               # tools | ssh | both

ssh:                        # used when mode is ssh or both
  host: REQUIRED            # public IP / DNS of the docker host
  user: ubuntu
  port: 22
  key_path: REQUIRED        # path to your private key file (.pem)
  compose_file: ""          # remote path of docker-compose.yml, gives declared dependencies (optional)
  extra_edges: []           # [[caller, callee], ...] if you have no compose file
  name_map: {}              # { service: container } when names do not match by substring (mode both)

sources:
  prometheus:
    url: ""                 # OPTIONAL. e.g. http://<host>:9090 or Grafana's proxy path. Empty = traces only
    # PromQL per metric; {service} is substituted. Defaults suit cAdvisor labels.
    queries:
      cpu: 'sum(rate(container_cpu_usage_seconds_total{name=~".*{service}.*"}[1m]))'
      memory: 'sum(container_memory_working_set_bytes{name=~".*{service}.*"})'
      net_rx: 'sum(rate(container_network_receive_bytes_total{name=~".*{service}.*"}[1m]))'
      net_tx: 'sum(rate(container_network_transmit_bytes_total{name=~".*{service}.*"}[1m]))'
  jaeger:
    url: REQUIRED           # e.g. http://<host>:16686, or http://<host>:8080/jaeger/ui for the OTel demo
    entry_services: []      # services whose traces to pull (empty = all); [frontend] means far fewer requests
    slice_seconds: 120      # fetch in slices so long windows are not cut to the newest `limit` traces
    limit: 300              # max traces per slice per service
  loki:
    url: ""                 # optional, e.g. http://<host>:3100 (logs)
    # LogQL; {service} is substituted. Counts error lines per window.
    error_query: 'sum(count_over_time({service="{service}"} |~ "(?i)error|exception|fatal" [1m]))'

collection:
  step_seconds: 15          # window size
  baseline_minutes: 10      # normal-behaviour period used to calibrate (unlabeled)

detector:
  kind: calibrated          # calibrated (recommended) | robust_z | isolation_forest
  z_threshold: 3.5          # used by robust_z only
  alarm_budget_per_hour: 5  # calibrated: target false alarms per hour for the whole system (measured on a healthy slice)
  persistence: 3            # consecutive judged windows above threshold before a service is flagged
  calibration_windows: 100  # windows after the baseline used to pick the alarm threshold; keep them fault-free
  candidate_threshold: 3.5  # after an alarm, services above this are ranked as root-cause candidates

cascade:
  max_lag_windows: 4        # how far apart (in windows) a cause and effect may be
  max_hops: 3

experiment:
  runs: 10
  top_k: [1, 3, 5]
