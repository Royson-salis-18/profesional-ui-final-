# ShopFlow -- online retail, 12 containers. This file is the HEALTHY BASELINE: sized, wired and
# configured the way a careful team would ship it. Scenarios in ./scenarios layer a single
# realistic production condition on top of it (docker compose -f docker-compose.yml -f scenarios/<id>/compose.override.yml up).
#
# Declared dependencies (depends_on) here are complete and accurate on purpose: in the baseline the
# mapper should draw declared == observed. Every scenario that breaks that equality does so deliberately.
name: shopflow

x-node: &node
  restart: always
x-logging: &logging
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  api-gateway:
    image: nginx:1.27-alpine
    restart: always
    ports: ["8080:8080"]
    environment:
      GATEWAY_READ_TIMEOUT: ${GATEWAY_READ_TIMEOUT:-10s}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes: ["./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro"]
    depends_on: [catalog, cart, orders]
    mem_limit: 128m
    <<: *logging

  catalog:
    <<: [*node, *logging]
    image: shopflow/catalog:dev
    build: { context: ., dockerfile: services/catalog/Dockerfile }
    environment:
      SERVICE_NAME: catalog
      CATALOG_DB_HOST: catalog-db
      CATALOG_DB_USER: app
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog-secret}
      CATALOG_DB_POOL_MAX: ${CATALOG_DB_POOL_MAX:-10}
      CACHE_HOST: catalog-cache
      CACHE_TTL_S: ${CACHE_TTL_S:-120}
      RECS_ENABLED: "false"
    depends_on:
      catalog-db: { condition: service_healthy }
      catalog-cache: { condition: service_started }
    mem_limit: 256m
    cpus: ${CATALOG_CPUS:-1.0}

  catalog-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog-secret}
      POSTGRES_DB: catalog
      SEED_PRODUCTS: ${SEED_PRODUCTS:-5000}
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=128MB"]
    volumes: ["./db/catalog-db:/docker-entrypoint-initdb.d:ro", "catalog-db-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d inventory"], interval: 5s, timeout: 3s, retries: 20 }
    mem_limit: 512m
    <<: *logging

  catalog-cache:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    mem_limit: 128m

  cart:
    <<: [*node, *logging]
    image: shopflow/cart:dev
    build: { context: ., dockerfile: services/cart/Dockerfile }
    environment:
      SERVICE_NAME: cart
      CART_STORE_HOST: cart-store
      CATALOG_URL: http://catalog:3001
      RECENT_MAX_ENTRIES: ${RECENT_MAX_ENTRIES:-20000}
    depends_on: [cart-store, catalog]
    mem_limit: ${CART_MEM_LIMIT:-256m}

  cart-store:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes: ["cart-store-data:/data"]
    mem_limit: 160m

  inventory:
    <<: [*node, *logging]
    image: shopflow/inventory:dev
    build: { context: ., dockerfile: services/inventory/Dockerfile }
    environment:
      SERVICE_NAME: inventory
      INVENTORY_DB_HOST: catalog-db
      INVENTORY_DB_USER: app
      INVENTORY_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog-secret}
      INVENTORY_DB_POOL_MAX: ${INVENTORY_DB_POOL_MAX:-10}
    depends_on:
      catalog-db: { condition: service_healthy }
    mem_limit: 192m

  payments:
    <<: [*node, *logging]
    image: shopflow/payments:dev
    build: { context: ., dockerfile: services/payments/Dockerfile }
    environment:
      SERVICE_NAME: payments
      PSP_URL: http://psp-sandbox:4000
      PSP_RETRY_MAX: ${PAYMENTS_PSP_RETRY_MAX:-2}
      PSP_RETRY_BACKOFF_MS: ${PAYMENTS_PSP_RETRY_BACKOFF_MS:-200}
    depends_on: [psp-sandbox]
    mem_limit: 192m

  psp-sandbox:
    <<: [*node, *logging]
    image: shopflow/psp-sandbox:dev
    build: { context: ., dockerfile: services/psp-sandbox/Dockerfile }
    environment:
      SERVICE_NAME: psp-sandbox
      PSP_RATE_LIMIT_RPS: ${PSP_RATE_LIMIT_RPS:-0}
      PSP_LATENCY_MS: ${PSP_LATENCY_MS:-40}
    mem_limit: 128m

  orders:
    <<: [*node, *logging]
    image: shopflow/orders:dev
    build: { context: ., dockerfile: services/orders/Dockerfile }
    environment:
      SERVICE_NAME: orders
      ORDERS_DB_HOST: orders-db
      ORDERS_DB_USER: app
      ORDERS_DB_PASSWORD: ${ORDERS_APP_DB_PASSWORD:-orders-secret}
      ORDERS_DB_POOL_MAX: ${ORDERS_DB_POOL_MAX:-10}
      NATS_URL: nats://event-bus:4222
      CART_URL: http://cart:3002
      INVENTORY_URL: http://inventory:3003
      PAYMENTS_URL: http://payments:3004
      PAYMENTS_RETRY_MAX: ${ORDERS_PAYMENTS_RETRY_MAX:-1}
      PAYMENTS_RETRY_BACKOFF_MS: ${ORDERS_PAYMENTS_RETRY_BACKOFF_MS:-250}
      DB_CONNECT_RETRIES: ${DB_CONNECT_RETRIES:-30}
      ORDER_EVENT_SCHEMA: ${ORDER_EVENT_SCHEMA:-1}
    depends_on:
      orders-db: { condition: service_healthy }
      event-bus: { condition: service_started }
      cart: { condition: service_started }
      inventory: { condition: service_started }
      payments: { condition: service_started }
    mem_limit: 256m

  orders-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-orders-secret}
      POSTGRES_DB: orders
      SEED_ORDERS: ${SEED_ORDERS:-5000}
    volumes: ["./db/orders-db:/docker-entrypoint-initdb.d:ro", "orders-db-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d orders"], interval: 5s, timeout: 3s, retries: 60 }
    mem_limit: 1g
    <<: *logging

  event-bus:
    image: nats:2.10-alpine
    restart: always
    command: ["-js", "-sd", "/data"]
    volumes: ["event-bus-data:/data"]
    mem_limit: 192m

  notifier:
    <<: [*node, *logging]
    image: shopflow/notifier:dev
    build: { context: ., dockerfile: services/notifier/Dockerfile }
    environment:
      SERVICE_NAME: notifier
      NATS_URL: nats://event-bus:4222
      ORDERS_URL: http://orders:3005
      NOTIFIER_ENRICH_FROM_CATALOG: ${NOTIFIER_ENRICH_FROM_CATALOG:-false}
      NOTIFIER_MAX_DELIVER: ${NOTIFIER_MAX_DELIVER:-5}
      NOTIFIER_MAX_ACK_PENDING: ${NOTIFIER_MAX_ACK_PENDING:-20}
      NOTIFIER_NAK_DELAY_MS: ${NOTIFIER_NAK_DELAY_MS:-5000}
    depends_on: [event-bus, orders]
    mem_limit: 192m

  # Always-on realistic traffic so the bench has live data without an external client:  --profile traffic  (make bench)
  traffic:
    profiles: [traffic]
    image: shopflow/traffic:dev
    build: { context: ., dockerfile: loadgen/Dockerfile }
    restart: always
    environment: { BASE_URL: "http://api-gateway:8080", CONCURRENCY: "${TRAFFIC_CONCURRENCY:-4}", THINK_MS: "${TRAFFIC_THINK_MS:-300}", USERS: "100" }
    depends_on: [api-gateway]
    mem_limit: 96m

volumes: { catalog-db-data: {}, orders-db-data: {}, cart-store-data: {}, event-bus-data: {} }
