# For a public host (e.g. EC2): upstream publishes every database, Kafka, Redis, Connect and service port on 0.0.0.0 with demo-default passwords.
# This keeps ONLY the gateway public (8080) and binds Prometheus to localhost (the mapper queries it over SSH).
# Still open the security group to 8080 (and 22) only: Docker-published ports bypass host firewalls such as ufw.
services:
  connect:
    ports: !override []
  inventory-service:
    ports: !override []
  kafka:
    ports: !override []
  postgres-inventory:
    ports: !override []
  postgres-order:
    ports: !override []
  postgres-payment:
    ports: !override []
  postgres-projection:
    ports: !override []
  postgres-review:
    ports: !override []
  postgres-user:
    ports: !override []
  projection-service:
    ports: !override []
  redis-gateway:
    ports: !override []
  redis-projection:
    ports: !override []
  review-service:
    ports: !override []
  user-service:
    ports: !override []
  prometheus:
    ports: !override ["127.0.0.1:9090:9090"]
