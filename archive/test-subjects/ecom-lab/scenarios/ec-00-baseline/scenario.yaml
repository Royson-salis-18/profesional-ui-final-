id: ec-00-baseline
title: Healthy baseline (control group)
class: control
verified: docker
summary: 'The small profile under realistic mixed load with a responsive (200 ms) payment provider. Everything should be quiet: saga drains, nothing
  restarts, no errors. Keep this run as the false-positive reference.'
run: './run-scenario.sh ec-00-baseline   # 60 s, 20 concurrent clients, mix browse 75 / orders 15 / purchase 10, 200 ms mock payment provider'
measured_in_docker:
  requests: 7,325 in 60 s (122 rps)
  errors_5xx: 0
  latency:
    p50_ms: 13
    p95_ms: 61
  saga: DELIVERED=219 CANCELLED=27 (simulated 10% decline) PROCESSING=16 (steady)
  kafka_lag_messages: 4
ground_truth:
