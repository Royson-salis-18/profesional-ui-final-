natural_findings:
- finding: review-service -> user-service is an undeclared dependency in upstream's own compose file (review depends_on only its database and
    connect-init). It is a real HTTP call (GET /api/v1/internal/users/{id}/name) made on every review creation.
  verified: posting one review moved user-service's internal-endpoint request counter 0 -> 1
  light_it_up: POST /api/reviews {productId, rating, comment} with a Bearer token
  expect:
    source: review-service
    target: user-service
    declared: false
    observed: true
- finding: The declared graph includes edges to connect-init, a one-shot job that exits 0 after registering Debezium connectors; a declared edge
    to an exited container is normal here, not a fault.
mapper_notes:
- 'Tier 1 (gateway access log) is blind on this system: Spring Cloud Gateway writes no per-request lines.'
- Tier 2 needs three additions to the mapper (family http_server_requests_seconds, label 'application', status label 'status'); see ecom-lab/README.md
